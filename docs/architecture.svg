<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
  <title id="title">How PetalPatch works</title>
  <desc id="desc">A search goes to PetalPatch, which requests CVE records from NVD, Ubuntu package status from the Ubuntu Security Tracker, and news from GDELT, then presents a sourced report. Recent CVE IDs are kept in browser storage and searches are shareable by URL.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#8a83bd" />
    </marker>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbfcff" />
      <stop offset="1" stop-color="#f1f5fc" />
    </linearGradient>
  </defs>
  <rect width="1200" height="510" rx="26" fill="#edf4fa" />
  <circle cx="1095" cy="74" r="95" fill="#dcd8f2" opacity=".34" />
  <circle cx="120" cy="425" r="110" fill="#e8d3e1" opacity=".24" />
  <text x="56" y="62" fill="#536487" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">A SMALL MAP OF THE RESEARCH FLOW</text>
  <text x="56" y="103" fill="#18254a" font-family="Georgia, serif" font-size="30">One search, clearly sourced.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="52" y="158" width="225" height="182" rx="18" fill="url(#paper)" stroke="#cbd7e8" />
    <circle cx="83" cy="190" r="13" fill="#f1effb" stroke="#d8d3ef" />
    <path d="M78 190h10m-5-5v10" stroke="#776ebd" stroke-width="1.5" stroke-linecap="round" />
    <text x="72" y="232" fill="#26365d" font-size="17" font-weight="700">Your search</text>
    <text x="72" y="258" fill="#536487" font-size="13">CVE ID, domain, site,</text>
    <text x="72" y="278" fill="#536487" font-size="13">or product name</text>
    <rect x="72" y="299" width="132" height="23" rx="11.5" fill="#f0effa" />
    <text x="85" y="315" fill="#615a9e" font-size="10" font-weight="600">one simple search box</text>

    <path d="M291 249h48" fill="none" stroke="#8a83bd" stroke-width="1.8" marker-end="url(#arrow)" />

    <rect x="352" y="145" width="276" height="208" rx="20" fill="#fbfcff" stroke="#aaa1d5" stroke-width="1.4" />
    <path d="M379 180c8-15 18-15 26 0 8-15 18-15 26 0-8 14-18 14-26 0-8 14-18 14-26 0Z" fill="#bdb5eb" opacity=".72" />
    <text x="379" y="222" fill="#18254a" font-family="Georgia, serif" font-size="23">PetalPatch</text>
    <text x="379" y="247" fill="#536487" font-size="13">Fetches public records and</text>
    <text x="379" y="267" fill="#536487" font-size="13">organizes the useful details.</text>
    <line x1="379" y1="288" x2="601" y2="288" stroke="#dce5f0" />
    <text x="379" y="313" fill="#7785a1" font-size="11">React · Vite · runs in your browser</text>
    <text x="379" y="333" fill="#7785a1" font-size="11">No account or API key required</text>

    <path d="M642 220h48v-34h26m-26 34v70h26" fill="none" stroke="#8a83bd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M710 186h10m-10 104h10" fill="none" stroke="#8a83bd" stroke-width="1.8" marker-end="url(#arrow)" />

    <rect x="733" y="146" width="210" height="82" rx="15" fill="#fbfcff" stroke="#cbd7e8" />
    <circle cx="758" cy="174" r="7" fill="#80b9ca" />
    <text x="777" y="178" fill="#26365d" font-size="15" font-weight="700">NVD + Ubuntu</text>
    <text x="753" y="202" fill="#536487" font-size="10">CVE records + Ubuntu package status</text>

    <rect x="733" y="249" width="210" height="82" rx="15" fill="#fbfcff" stroke="#cbd7e8" />
    <circle cx="758" cy="277" r="7" fill="#ad9fd8" />
    <text x="777" y="281" fill="#26365d" font-size="15" font-weight="700">GDELT</text>
    <text x="753" y="305" fill="#536487" font-size="11">Public news results for site searches</text>

    <path d="M956 187h36v38h25m-25-38v102h25" fill="none" stroke="#8a83bd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M1010 225h10m-10 64h10" fill="none" stroke="#8a83bd" stroke-width="1.8" marker-end="url(#arrow)" />

    <rect x="1033" y="174" width="130" height="144" rx="17" fill="#fbfcff" stroke="#cbd7e8" />
    <text x="1052" y="207" fill="#26365d" font-size="14" font-weight="700">Research view</text>
    <text x="1052" y="233" fill="#536487" font-size="11">Dates · severity</text>
    <text x="1052" y="252" fill="#536487" font-size="11">Products · sources</text>
    <text x="1052" y="271" fill="#536487" font-size="11">Reporting leads</text>
    <text x="1052" y="299" fill="#7785a1" font-size="10">with limits made clear</text>

    <path d="M490 369v26m-124 0h248m-248 0v11m248-11v11" fill="none" stroke="#aab5ca" stroke-width="1.5" stroke-linecap="round" />
    <rect x="248" y="406" width="244" height="54" rx="14" fill="#f7f6fd" stroke="#d8d3ef" />
    <text x="270" y="429" fill="#4d4c81" font-size="12" font-weight="700">Recent CVE IDs</text>
    <text x="270" y="447" fill="#7785a1" font-size="11">Saved in this browser only</text>
    <rect x="506" y="406" width="244" height="54" rx="14" fill="#f2f8fb" stroke="#cbe0e9" />
    <text x="528" y="429" fill="#385f77" font-size="12" font-weight="700">Shareable lookup links</text>
    <text x="528" y="447" fill="#7785a1" font-size="11">Search terms live in the URL</text>
    <text x="782" y="437" fill="#7886a4" font-size="11">Public sources stay the source of truth.</text>
  </g>
</svg>
